<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="description" content="صفحة الدفع — GOSTA">
    <meta name="theme-color" content="#0f1d3d">
    <title>صفحة الدفع — GOSTA</title>
    <link rel="stylesheet" href="payment-styles.css">
    <link rel="stylesheet" href="payment-responsive.css">
    <link rel="stylesheet" href="responsive.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="mobile-app.css">
</head>
<body>
    <div class="payment-container">
        <!-- رأس الصفحة -->
        <div class="payment-header">
            <button type="button" class="btn-back" onclick="goBackToSubscriptions()">⬅ عودة</button>
            <div class="payment-header-text">
                <h1>أكمل عملية الدفع</h1>
                <p class="payment-header-subtitle">اختر طريقة الدفع الآمنة لإتمام اشتراكك</p>
            </div>
        </div>

        <!-- ملخص الخطة -->
        <div class="plan-summary plan-summary-cards">
            <div class="summary-item">
                <span class="summary-label">الخطة:</span>
                <span class="summary-value" id="planName">-</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">المساحة:</span>
                <span class="summary-value" id="planStorage">-</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">السعر:</span>
                <span class="summary-value" id="planPrice">-</span>
            </div>
        </div>

        <div class="payment-methods">
            <p class="payment-methods-lead">طرق الدفع المتاحة</p>
            <div class="payment-method-card" data-method="huawei" id="huaweiPaymentCard" style="display: none;">
                <div class="method-header">
                    <div class="method-title">
                        <span>Huawei AppGallery</span>
                    </div>
                    <span class="method-icon" aria-hidden="true">📱</span>
                </div>
                <div class="method-content">
                    <p class="method-description">اشتراك آمن عبر Huawei AppGallery (تطبيق Android)</p>
                    <button type="button" class="btn-proceed-electronic" id="btnHuaweiPay">الدفع عبر Huawei</button>
                </div>
            </div>
            <div class="payment-method-card active" data-method="electronic">
                <div class="method-header" onclick="selectPaymentMethod('electronic')">
                    <div class="method-title">
                        <input type="radio" name="paymentMethod" value="electronic" checked>
                        <span>الدفع الإلكتروني</span>
                    </div>
                    <span class="method-icon" aria-hidden="true">🔒</span>
                </div>
                <div class="method-content">
                    <p class="method-description">دفع آمن عبر البطاقة الائتمانية Visa أو Mada</p>
                    <div class="payment-options">
                        <button type="button" class="payment-option" onclick="proceedToCardPayment('visa')">
                            <span class="option-icon" aria-hidden="true">💳</span>
                            <span>بطاقة Visa</span>
                        </button>
                        <button type="button" class="payment-option" onclick="proceedToCardPayment('mada')">
                            <span class="option-icon" aria-hidden="true">💳</span>
                            <span>بطاقة Mada</span>
                        </button>
                    </div>
                    <button type="button" class="btn-proceed-electronic" onclick="proceedToCardPayment('visa')">متابعة الدفع الإلكتروني</button>
                </div>
            </div>
        </div>
    </div>

    <script src="user-storage-scope.js"></script>
    <script src="pr-safe-auth-port.js"></script>
    <script src="pr-safe-auth-production.js"></script>
    <script src="pr-safe-auth-config.js"></script>
    <script src="subscription-check.js"></script>
    <script src="payment.js"></script>
</body>
</html>
